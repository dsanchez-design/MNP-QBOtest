<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MNP — Bookkeeper Assessment</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; color: #333; padding: 0 16px; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .muted { color: #777; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { width: 100%; padding: 11px; margin-top: 8px; border: none; border-radius: 6px; background: #FFA629; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #ddd; color: #999; cursor: not-allowed; }
    button.secondary { background: #eee; color: #444; }
    .card { border: 1px solid #e2e2e2; border-radius: 10px; padding: 14px; margin: 10px 0; }
    .card.done { opacity: 0.55; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #FFE1B8; color: #a05a00; font-weight: bold; }
    .badge.done { background: #e2e2e2; color: #777; }
    #stage { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16/10; }
    #canvasPreview { width: 100%; height: 100%; object-fit: contain; }
    #recDot { display:none; position:absolute; top:8px; left:8px; width:9px; height:9px; border-radius:50%; background:#e03131; }
    #timer { display:none; position:absolute; top:6px; right:8px; color:#fff; font-size:12px; font-family:monospace; }
    .row { display: flex; gap: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>MNP — Bookkeeper assessment</h1>
  <p class="muted" id="subtitle">Register to start.</p>

  <!-- STEP 1: Register -->
  <div id="stepRegister">
    <input id="name" type="text" placeholder="Full name" />
    <input id="email" type="email" placeholder="name@email.com" />
    <button id="btnRegister">Continue</button>
  </div>

  <!-- STEP 2: Question list -->
  <div id="stepQuestions" class="hidden"></div>

  <!-- STEP 3: Recording -->
  <div id="stepRecord" class="hidden">
    <p class="muted" id="qInstructions"></p>
    <div id="stage">
      <video id="canvasPreview" autoplay muted playsinline></video>
      <span id="recDot"></span>
      <span id="timer">00:00</span>
    </div>
    <div class="row">
      <button id="btnStart">Start recording</button>
      <button id="btnStop" class="secondary" disabled>Stop</button>
    </div>
    <button id="btnSubmit" disabled>Submit this recording</button>
    <button id="btnCancel" class="secondary">Back to questions</button>
  </div>

  <!-- STEP 4: Done (filled in dynamically by renderDoneScreen) -->
  <div id="stepDone" class="hidden"></div>

<script>
// ============================================================
// FILL THIS IN after you deploy the Apps Script backend:
// Deploy → Manage deployments → copy the "Web app" URL.
// ============================================================
const WEB_APP_URL = 'hhttps://script.google.com/macros/s/AKfycbxzlVq5RY4g2I3d7MlkikEYOwirNrWarzi1C__HiTTy2Z4204D5RypqEwIR4tOTfz8/exec';
// Where the candidate is told to send their completion confirmation:
const ADMIN_EMAIL = 'dsanchez@mightynonprofits.com';

let sessionStart = null;
let sessionEnd = null;

let candidateName = '';
let candidateEmail = '';
let currentQuestion = null;
let questions = [];
let sandboxUrl = '';

let screenStream, camStream, mixedStream, recorder, chunks = [];
let drawLoop, timerInt, seconds = 0;

function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  return fetch(WEB_APP_URL + '?' + qs).then(r => r.json());
}

// IMPORTANT: no custom headers here — a default content-type keeps this a
// "simple request" so the browser skips CORS preflight (Apps Script can't
// answer preflight OPTIONS requests).
function apiPost(payload) {
  return fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) }).then(r => r.json());
}

function showStep(id) {
  ['stepRegister','stepQuestions','stepRecord','stepDone'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

// ---- Step 1: Register ----
document.getElementById('btnRegister').onclick = () => {
  candidateName = document.getElementById('name').value.trim();
  candidateEmail = document.getElementById('email').value.trim();
  if (!candidateName || !candidateEmail) { alert('Please fill in both fields.'); return; }
  sessionStart = new Date();
  document.getElementById('subtitle').textContent = 'Loading your questions...';

  const stuckTimer = setTimeout(() => {
    alert('This is taking too long. Check that WEB_APP_URL is set correctly and the Apps Script backend is deployed.');
  }, 8000);

  apiGet({ action: 'questions' })
    .then(res => {
      questions = res.questions;
      sandboxUrl = res.sandboxUrl;
      return apiGet({ action: 'status', email: candidateEmail });
    })
    .then(res => { clearTimeout(stuckTimer); renderQuestionList(res.status); })
    .catch(err => { clearTimeout(stuckTimer); onLoadError(err); });
};

function onLoadError(err) {
  document.getElementById('subtitle').textContent = 'Something went wrong.';
  alert('Could not load questions.\n\nDetails: ' + (err && err.message ? err.message : err));
}

// ---- Step 2: Question list ----
function renderQuestionList(status) {
  document.getElementById('subtitle').textContent = 'Hi ' + candidateName + ' — 1 attempt per question.';
  const box = document.getElementById('stepQuestions');
  box.innerHTML = '';

  const banner = document.createElement('div');
  banner.className = 'card';
  banner.style.background = '#FFE1B8';
  banner.innerHTML =
    '<p style="font-weight:bold;margin:0 0 6px;">Your sandbox</p>' +
    '<p class="muted" style="margin:0 0 8px;">Open this in a separate tab before you start recording each question.</p>' +
    '<a href="' + sandboxUrl + '" target="_blank" style="display:inline-block;background:#FFA629;color:#fff;padding:8px 14px;border-radius:6px;text-decoration:none;font-weight:bold;font-size:13px;">Open sandbox ↗</a>';
  box.appendChild(banner);

  questions.forEach(q => {
    const done = status[q.id] === 'submitted';
    const div = document.createElement('div');
    div.className = 'card' + (done ? ' done' : '');
    div.innerHTML =
      '<span class="badge' + (done ? ' done' : '') + '">' + (done ? 'Submitted' : 'Available') + '</span>' +
      '<p style="font-weight:bold;margin:8px 0 4px;">' + q.title + '</p>' +
      '<p class="muted" style="margin:0 0 8px;">' + q.instructions + '</p>' +
      '<p style="margin:0 0 8px;font-size:12px;color:#a05a00;font-weight:bold;">⏱ Time limit: ' + q.timeLimitMin + ' min · Only 1 attempt — take a breath, this is meant to be straightforward. Trust what you know.</p>';
    if (!done) {
      const btn = document.createElement('button');
      btn.textContent = 'Start question';
      btn.onclick = () => startQuestion(q);
      div.appendChild(btn);
    }
    box.appendChild(div);
  });
  const allDone = questions.every(q => status[q.id] === 'submitted');
  if (allDone) {
    sessionEnd = new Date();
    renderDoneScreen();
  }
  showStep(allDone ? 'stepDone' : 'stepQuestions');
}

function fmt(d) {
  if (!d) return '—';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
    ' · ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function renderDoneScreen() {
  const box = document.getElementById('stepDone');
  const subject = encodeURIComponent('Assessment completed — ' + candidateName);
  const body = encodeURIComponent(
    'Hi,\n\nI completed the bookkeeper assessment.\n\n' +
    'Name: ' + candidateName + '\n' +
    'Email: ' + candidateEmail + '\n' +
    'Started: ' + fmt(sessionStart) + '\n' +
    'Finished: ' + fmt(sessionEnd) + '\n\n' +
    'Thank you!'
  );
  const mailtoLink = 'mailto:' + ADMIN_EMAIL + '?subject=' + subject + '&body=' + body;

  box.innerHTML =
    '<div class="card" style="text-align:center;">' +
      '<p style="font-size:15px;font-weight:bold;color:#2b8a3e;margin:0 0 4px;">✓ All questions submitted</p>' +
      '<p class="muted" style="margin:0 0 14px;">Thank you — here is your confirmation.</p>' +
      '<div style="text-align:left;background:#F7F7F7;border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.7;">' +
        '<strong>Name:</strong> ' + candidateName + '<br>' +
        '<strong>Email:</strong> ' + candidateEmail + '<br>' +
        '<strong>Started:</strong> ' + fmt(sessionStart) + '<br>' +
        '<strong>Finished:</strong> ' + fmt(sessionEnd) +
      '</div>' +
      '<a href="' + mailtoLink + '" style="display:block;margin-top:14px;background:#FFA629;color:#fff;padding:11px;border-radius:6px;text-decoration:none;font-weight:bold;font-size:14px;">Send confirmation email</a>' +
      '<p class="muted" style="margin-top:10px;">Please send this confirmation so we know you have completed the assessment.</p>' +
    '</div>';
}

// ---- Step 3: Recording ----
function startQuestion(q) {
  currentQuestion = q;
  document.getElementById('qInstructions').innerHTML =
    '<strong>' + q.title + '</strong> — ' + q.instructions +
    '<br><span style="color:#a05a00;font-weight:bold;">⏱ Time limit: ' + q.timeLimitMin + ' min · Only 1 attempt — trust what you know.</span>';
  document.getElementById('btnSubmit').disabled = true;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
  showStep('stepRecord');
}

document.getElementById('btnCancel').onclick = () => {
  stopAllTracks();
  apiGet({ action: 'status', email: candidateEmail }).then(res => renderQuestionList(res.status));
};

document.getElementById('btnStart').onclick = async () => {
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch (err) {
    alert('Screen and camera access are required to record: ' + err.message);
    return;
  }

  const canvas = document.createElement('canvas');
  canvas.width = 1280; canvas.height = 800;
  const ctx = canvas.getContext('2d');
  const screenVideo = document.createElement('video');
  screenVideo.srcObject = screenStream; screenVideo.muted = true; screenVideo.play();
  const camVideo = document.createElement('video');
  camVideo.srcObject = camStream; camVideo.muted = true; camVideo.play();

  const previewEl = document.getElementById('canvasPreview');

  function draw() {
    ctx.drawImage(screenVideo, 0, 0, canvas.width, canvas.height);
    const camW = 240, camH = 180, pad = 16;
    ctx.save();
    ctx.beginPath();
    ctx.rect(canvas.width - camW - pad, canvas.height - camH - pad, camW, camH);
    ctx.clip();
    ctx.drawImage(camVideo, canvas.width - camW - pad, canvas.height - camH - pad, camW, camH);
    ctx.restore();
    ctx.strokeStyle = '#FFA629';
    ctx.lineWidth = 3;
    ctx.strokeRect(canvas.width - camW - pad, canvas.height - camH - pad, camW, camH);
    drawLoop = requestAnimationFrame(draw);
  }
  draw();

  mixedStream = canvas.captureStream(30);
  camStream.getAudioTracks().forEach(t => mixedStream.addTrack(t));
  previewEl.srcObject = mixedStream;

  chunks = [];
  const webmType = 'video/webm;codecs=vp9,opus';
  const recordedMime = MediaRecorder.isTypeSupported(webmType) ? webmType : 'video/webm';
  window.__recordedMime = recordedMime;
  recorder = new MediaRecorder(mixedStream, { mimeType: recordedMime });
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.start();

  document.getElementById('recDot').style.display = 'block';
  document.getElementById('timer').style.display = 'block';
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').disabled = false;
  seconds = 0;
  timerInt = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds/60)).padStart(2,'0');
    const s = String(seconds%60).padStart(2,'0');
    document.getElementById('timer').textContent = m + ':' + s;
  }, 1000);

  screenStream.getVideoTracks()[0].onended = () => document.getElementById('btnStop').click();
};

document.getElementById('btnStop').onclick = () => {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  cancelAnimationFrame(drawLoop);
  clearInterval(timerInt);
  document.getElementById('recDot').style.display = 'none';
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnSubmit').disabled = false;
  stopAllTracks();
};

function stopAllTracks() {
  [screenStream, camStream].forEach(s => { if (s) s.getTracks().forEach(t => t.stop()); });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const marker = 'base64,';
      const idx = reader.result.indexOf(marker);
      resolve(reader.result.substring(idx + marker.length));
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

document.getElementById('btnSubmit').onclick = () => {
  document.getElementById('btnSubmit').disabled = true;
  document.getElementById('btnSubmit').textContent = 'Uploading...';
  setTimeout(async () => {
    try {
      const finalMime = window.__recordedMime || 'video/webm';
      const blob = new Blob(chunks, { type: finalMime });
      const base64 = await blobToBase64(blob);

      apiPost({
        name: candidateName,
        email: candidateEmail,
        questionId: currentQuestion.id,
        mimeType: finalMime,
        videoBase64: base64
      })
      .then(onSubmitDone)
      .catch(onSubmitError);
    } catch (err) {
      onSubmitError(err);
    }
  }, 200);
};

function onSubmitDone(res) {
  document.getElementById('btnSubmit').textContent = 'Submit this recording';
  if (!res.ok) { alert('Could not submit: ' + res.error); document.getElementById('btnSubmit').disabled = false; return; }

  // Clear, unmissable confirmation before we auto-return — no click required.
  document.getElementById('qInstructions').innerHTML =
    '<span style="color:#2b8a3e;font-weight:bold;">✓ Recording submitted successfully.</span><br>Taking you back to your questions...';
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnSubmit').disabled = true;
  document.getElementById('btnCancel').disabled = true;

  setTimeout(() => {
    document.getElementById('btnCancel').disabled = false;
    apiGet({ action: 'status', email: candidateEmail }).then(r => renderQuestionList(r.status));
  }, 1600);
}

function onSubmitError(err) {
  document.getElementById('btnSubmit').textContent = 'Submit this recording';
  document.getElementById('btnSubmit').disabled = false;
  alert('Upload failed: ' + (err && err.message ? err.message : err));
}
</script>
</body>
</html>
